<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sorteio Vôlei">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F5FBF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<title>Sorteio do Vôlei</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna de app, placar de quadra. Cards de time como "placas" numeradas, jogos como fila de chamada. */
:root {
  --bg: #EDF1F6;
  --surface: #FFFFFF;
  --ink: #10233D;
  --muted: #5A6A80;
  --line: #D3DBE6;
  --court: #1F5FBF;
  --court-ink: #FFFFFF;
  --court-soft: #DCE7F8;
  --ball: #F2B705;
  --ball-ink: #2A1F00;
  --good: #17804F;
  --warn: #A64B00;
  --warn-soft: #FDEBD7;
  --shadow: 0 1px 2px rgba(16, 35, 61, .08), 0 4px 14px rgba(16, 35, 61, .06);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1320; --surface: #132037; --ink: #E6EDF7; --muted: #93A3BA; --line: #243552;
    --court: #5B9BFF; --court-ink: #06142B; --court-soft: #1B3157; --ball: #F5C431; --ball-ink: #2A1F00;
    --good: #3CC489; --warn: #F2A65A; --warn-soft: #3A2612;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1320; --surface: #132037; --ink: #E6EDF7; --muted: #93A3BA; --line: #243552;
  --court: #5B9BFF; --court-ink: #06142B; --court-soft: #1B3157; --ball: #F5C431; --ball-ink: #2A1F00;
  --good: #3CC489; --warn: #F2A65A; --warn-soft: #3A2612;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px;
  display: flex; flex-direction: column; gap: 16px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1; text-transform: uppercase; }
h2 { font-size: 22px; text-transform: uppercase; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.ballmark { width: 30px; height: 30px; border-radius: 50%; background: var(--ball); position: relative; flex: none; overflow: hidden; }
.ballmark::before, .ballmark::after { content: ""; position: absolute; border: 2px solid var(--ball-ink); border-radius: 50%; opacity: .55; }
.ballmark::before { width: 34px; height: 34px; left: -18px; top: -2px; }
.ballmark::after { width: 34px; height: 34px; right: -18px; top: 6px; }
.tabs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { flex: 1; border: 0; background: none; color: var(--muted); font: 600 15px var(--body); padding: 8px 10px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs button:disabled { opacity: .4; cursor: default; }
.mode { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mode button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px; font: 600 15px var(--body); cursor: pointer; min-height: 44px; }
.mode button[aria-pressed="true"] { background: var(--court); border-color: var(--court); color: var(--court-ink); }
.tablewrap { overflow-x: auto; }
table.pts { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.pts th { text-align: right; font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.pts td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line); }
table.pts th:nth-child(2), table.pts td:nth-child(2) { text-align: left; width: 100%; }
table.pts td:first-child { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); }
table.pts td.big { font-family: var(--display); font-weight: 700; font-size: 20px; }
table.pts tr:first-child td:first-child { color: var(--ball-ink); }
table.pts tbody tr:first-child td:first-child span { background: var(--ball); border-radius: 6px; padding: 0 6px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.counter { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: .85; font-variant-numeric: tabular-nums; }
.count small { font-size: 22px; color: var(--muted); margin-left: 6px; text-transform: uppercase; }
.shape { text-align: right; color: var(--muted); font-size: 14px; }
.shape b { display: block; color: var(--ink); font-family: var(--display); font-size: 20px; text-transform: uppercase; }
.sizes { display: flex; gap: 4px; justify-content: flex-end; margin-top: 4px; }
.sizes span { min-width: 26px; padding: 2px 6px; border-radius: 6px; background: var(--court-soft); color: var(--ink); font: 700 14px var(--display); text-align: center; font-variant-numeric: tabular-nums; }
.sizes span.short { background: var(--ball); color: var(--ball-ink); }
.adder { display: flex; gap: 8px; align-items: flex-start; }
textarea {
  flex: 1; min-width: 0; resize: none; font: 16px var(--body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; max-height: 160px;
}
textarea:focus, button:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.btn {
  border: 0; border-radius: 10px; font: 600 16px var(--body); padding: 11px 16px; cursor: pointer;
  background: var(--court-soft); color: var(--ink); min-height: 44px;
}
.btn.primary { background: var(--court); color: var(--court-ink); }
.btn.ball { background: var(--ball); color: var(--ball-ink); font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; }
.btn.ghost { background: none; color: var(--muted); padding: 8px 4px; min-height: 0; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.btn.danger { background: var(--warn-soft); color: var(--warn); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 15px; max-width: 100%;
}
.chip .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-right: 2px; }
.chip .x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
.chip.pick { cursor: pointer; padding-right: 12px; font: inherit; color: var(--ink); min-height: 36px; }
.chip.pick.sel { background: var(--ball); border-color: var(--ball); color: var(--ball-ink); }
.chip.duo { background: var(--court-soft); border-color: transparent; font-weight: 600; }
.alert { border-radius: 12px; padding: 14px; background: var(--warn-soft); color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.alert strong { color: var(--warn); font-family: var(--display); font-size: 20px; text-transform: uppercase; }
.notice { font-size: 14px; color: var(--muted); background: var(--court-soft); border-radius: 10px; padding: 10px 12px; color: var(--ink); }
.empty { text-align: center; color: var(--muted); padding: 8px 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Rodada */
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.team-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.team-head h3 { font-size: 15px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.team-num { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: .8; color: var(--court); }
.team ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.team li { font-size: 16px; overflow-wrap: anywhere; }
.team li.duo { font-weight: 600; }
.team li.duo::after { content: "reveza"; margin-left: 6px; font: 600 10px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--court); vertical-align: 2px; }
.tag { align-self: flex-start; font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .05em; padding: 3px 7px; border-radius: 6px; background: var(--ball); color: var(--ball-ink); }
.meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.meta span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.games { display: flex; flex-direction: column; gap: 10px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.game.now { border-color: var(--court); box-shadow: 0 0 0 1px var(--court); }
.game-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.game-head .lbl { font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; }
.game-head .st { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.game.now .st { color: var(--court); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.vs .x { align-self: center; font-family: var(--display); color: var(--muted); font-size: 18px; }
.side {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 8px 10px;
  text-align: left; cursor: pointer; font: 16px var(--body); min-width: 0; display: flex; flex-direction: column; gap: 2px;
}
.side b { font-family: var(--display); font-size: 20px; text-transform: uppercase; }
.side span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.side.win { background: var(--good); border-color: var(--good); color: var(--court-ink); }
.side.win span { color: inherit; opacity: .85; }
.side.lose { opacity: .5; }
.side:disabled { cursor: default; }
.side.tbd { border-style: dashed; background: none; }
.rank { display: flex; flex-direction: column; gap: 6px; }
.rank-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; background: var(--bg); }
.rank-row .pos { font-family: var(--display); font-weight: 700; font-size: 26px; width: 34px; font-variant-numeric: tabular-nums; }
.rank-row:first-child .pos { color: var(--ball-ink); background: var(--ball); border-radius: 8px; text-align: center; }
.rank-row .who { min-width: 0; font-size: 14px; color: var(--muted); }
.rank-row .who b { display: block; color: var(--ink); font-family: var(--display); font-size: 18px; text-transform: uppercase; }
.pickrank { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1; }
details.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
details.hist summary { cursor: pointer; font-weight: 600; }
.hist-item { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.hist-item .when { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }

/* Folha de confirmação */
.scrim { position: fixed; inset: 0; background: rgba(5, 12, 24, .5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0;
  padding-top: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow-y: auto;
}
.sheet p { margin: 0; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px);
}
@media (max-width: 360px) { .teams, .pickrank { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) {
  .team { animation: drop .35s ease-out both; }
  .team:nth-child(2) { animation-delay: .06s; } .team:nth-child(3) { animation-delay: .12s; } .team:nth-child(4) { animation-delay: .18s; }
  @keyframes drop { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>
<!--APP-HEAD-END-->
</head>
<body>
<!--APP-BODY-START-->
<div class="wrap" id="app"></div>
<div id="layer"></div>
<script>
(function () {
  "use strict";
  var KEY = "volei-sorteio-v1";
  var MAX = 16;
  var EXEMPLO = ["Ana", "Bruno", "Carla", "Diego", "Edu", "Fernanda", "Gabi", "Hugo", "Iara", "João", "Kiko", "Lu", "Marcelo", "Nina", "Otávio"];

  // Ordem dos jogos por quantidade de times. Lados: {t: time}, {w: vencedor do jogo}, {l: perdedor do jogo}
  var FORMATO = {
    2: [["g1", { t: 0 }, { t: 1 }]],
    3: [["g1", { t: 0 }, { t: 1 }], ["g2", { w: "g1" }, { t: 2 }], ["g3", { l: "g1" }, { t: 2 }]],
    4: [["g1", { t: 0 }, { t: 1 }], ["g2", { t: 2 }, { t: 3 }], ["g3", { w: "g1" }, { w: "g2" }], ["g4", { l: "g1" }, { l: "g2" }]]
  };
  var ROTULO = { g1: "Jogo 1", g2: "Jogo 2", g3: "Jogo 3", g4: "Jogo 4" };
  // Pontos por colocação. Só rodadas com 4 times pontuam.
  var PONTOS = { 4: [3, 2, 1, 0] };
  // Pesos do sorteio. Repetir parceiro pesa mais que ficar parado; 3 ou mais do mesmo time anterior quase nunca acontece.
  var PESO_REPETICAO = 1, PESO_TRIO = 50, PESO_ESPERA = 0.3, PESO_EQUILIBRIO = 25;

  function padrao() { return { names: [], pairs: [], rounds: [], fromLast: false, scores: {}, mode: "rank" }; }
  function carregar() {
    try {
      var r = JSON.parse(localStorage.getItem(KEY));
      if (r && Array.isArray(r.names)) {
        var d = padrao();
        for (var k in d) if (r[k] !== undefined) d[k] = r[k];
        d.rounds.forEach(function (x) { if (x.closed === undefined) x.closed = !!x.ranking; });
        return d;
      }
    } catch (e) {}
    return padrao();
  }
  var S = carregar();
  function salvar() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var ui = { view: "list", sel: null, sheet: null, manual: null, draft: "" };
  if (pendente()) ui.view = "round";
  if (S.names.length && !pendente()) S.fromLast = true;

  // ---------- utilidades ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function chave(n) { return n.trim().toLowerCase(); }
  function pk(a, b) { a = chave(a); b = chave(b); return a < b ? a + "|" + b : b + "|" + a; }
  function media(a) { if (!a.length) return 0; var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
  function embaralhar(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pessoas(time) { return [].concat.apply([], time); }
  function ultima() { return S.rounds.length ? S.rounds[S.rounds.length - 1] : null; }
  function pendente() { var r = ultima(); return r && !r.closed ? r : null; }
  function nomeUnidade(u) { return u.join(" / "); }
  function plural(n, um, varios) { return n + " " + (n === 1 ? um : varios); }

  // ---------- estrutura da lista ----------
  function duplasNecessarias() { return Math.max(0, S.names.length - MAX); }
  function vagas() { return S.names.length - S.pairs.length; }
  function tamanhos(v) {
    if (v < 4) return [];
    if (v < 8) return [Math.ceil(v / 2), Math.floor(v / 2)];
    var t = Math.ceil(v / 4), a = [];
    for (var i = 0; i < t; i++) a.push(4);
    a[t - 1] = v - 4 * (t - 1);
    return a;
  }
  function prontoParaSortear() { return S.names.length >= 4 && S.pairs.length === duplasNecessarias(); }
  function unidades() {
    var emDupla = {};
    S.pairs.forEach(function (p) { emDupla[chave(p[0])] = 1; emDupla[chave(p[1])] = 1; });
    var u = S.pairs.map(function (p) { return [p[0], p[1]]; });
    S.names.forEach(function (n) { if (!emDupla[chave(n)]) u.push([n]); });
    return u;
  }

  // ---------- sorteio ----------
  // Peso de "já jogaram juntos": rodada mais recente pesa 1, anteriores vão caindo.
  function pesosDeParceria() {
    var m = {}, rs = S.rounds.slice(-8).reverse();
    rs.forEach(function (r, k) {
      var w = Math.pow(0.6, k);
      r.teams.forEach(function (time) {
        var p = pessoas(time);
        for (var i = 0; i < p.length; i++) for (var j = i + 1; j < p.length; j++) { var c = pk(p[i], p[j]); m[c] = (m[c] || 0) + w; }
      });
    });
    return m;
  }
  // Média de pontos por rodada, puxada para a média geral (1,5) enquanto a pessoa tem poucas rodadas.
  function nivel(n) {
    var s = S.scores[chave(n)];
    var pts = s ? s.pts : 0, rod = s ? s.rounds : 0;
    return (pts + 1.5 * 2) / (rod + 2) / 3;
  }
  // Quantos jogos cada pessoa já está parada no fim da rodada anterior.
  function esperaNoFim(r) {
    var out = {};
    if (!r || !r.closed) return out;
    var defs = FORMATO[r.teams.length], ultimoJogo = {}, ok = true;
    defs.forEach(function (d, i) {
      var l = lados(r, d[0]);
      if (l[0] === null || l[1] === null) { ok = false; return; }
      l.forEach(function (ti) { pessoas(r.teams[ti]).forEach(function (n) { ultimoJogo[chave(n)] = i; }); });
    });
    if (!ok) return out;
    for (var k in ultimoJogo) out[k] = defs.length - 1 - ultimoJogo[k];
    return out;
  }
  // Em qual time cada pessoa estava na rodada anterior.
  function timeAnterior(r) {
    var m = {};
    if (r) r.teams.forEach(function (t, ti) { pessoas(t).forEach(function (n) { m[chave(n)] = ti; }); });
    return m;
  }
  function avaliar(times, pw, esp, equilibrar, ant) {
    var rep = 0, ms = [], longa = 0, trio = 0;
    times.forEach(function (t, ti) {
      var p = pessoas(t), vindos = {};
      p.forEach(function (n) { var a = ant[chave(n)]; if (a !== undefined) vindos[a] = (vindos[a] || 0) + 1; });
      for (var a in vindos) if (vindos[a] >= 3) trio += vindos[a] - 2;
      for (var i = 0; i < p.length; i++) {
        for (var j = i + 1; j < p.length; j++) rep += pw[pk(p[i], p[j])] || 0;
        // Times 1 e 2 jogam o primeiro jogo. Quem cai nos outros espera pelo menos mais um jogo.
        if (ti >= 2 && (esp[chave(p[i])] || 0) >= 1) longa += esp[chave(p[i])];
      }
      if (equilibrar) ms.push(media(p.map(nivel)));
    });
    var bal = 0;
    if (equilibrar) { var g = media(ms); bal = media(ms.map(function (m) { return (m - g) * (m - g); })); }
    return PESO_REPETICAO * rep + PESO_TRIO * trio + PESO_ESPERA * longa + PESO_EQUILIBRIO * bal;
  }
  function sortear() {
    var us = unidades(), tam = tamanhos(us.length), pw = pesosDeParceria(), antes = ultima(), esp = esperaNoFim(antes), ant = timeAnterior(antes);
    var equilibrar = S.mode === "rank", melhor = null, melhorCusto = Infinity;
    for (var it = 0; it < 5000; it++) {
      var s = embaralhar(us.slice()), times = [], k = 0;
      tam.forEach(function (n) { times.push(s.slice(k, k + n)); k += n; });
      var c = avaliar(times, pw, esp, equilibrar, ant);

    var r = {
      id: Date.now(), date: new Date().toISOString(), teams: melhor, winners: {}, ranking: null, closed: false,

  function repetidos(times, antes) {

      var p = pessoas(t);
      for (var i = 0; i < p.length; i++) for (var j = i + 1; j < p.length; j++) {

  // ---------- jogos, ranking e pontos ----------
  function lados(r, g) {

    return [resolver(r, d[1]), resolver(r, d[2])];
  }
  function resolver(r, ref) {

    if (ref.w) return v;
    var l = lados(r, g);
    return l[0] === v ? l[1] : l[0];
  }
  function limparInvalidos(r) {
    FORMATO[r.teams.length].forEach(function (d) {
      var g = d[0], v = r.winners[g];
      if (v === undefined) return;
      var l = lados(r, g);
      if (l[0] === null || l[1] === null || l.indexOf(v) < 0) delete r.winners[g];
    });
  }
  function pontua(r) { return !!PONTOS[r.teams.length]; }
  function rankingAutomatico(r) {
    var T = r.teams.length, w = r.winners;
    function perd(g) { var l = lados(r, g); return l[0] === w[g] ? l[1] : l[0]; }
    if (T === 2) return w.g1 !== undefined ? [w.g1, perd("g1")] : null;
    if (T === 4) return w.g3 !== undefined && w.g4 !== undefined ? [w.g3, perd("g3"), w.g4, perd("g4")] : null;
    return null;
  }
  function aplicarPontos(r, sinal) {

    r.ranking.forEach(function (ti, pos) {
      pessoas(r.teams[ti]).forEach(function (n) {
        var k = chave(n), s = S.scores[k] || (S.scores[k] = { name: n, pts: 0, rounds: 0 });
        s.name = n; s.pts += sinal * tab[pos]; s.rounds += sinal;

  function painelDuplas(need) {

  function blocoTime(r, i) {

  function adicionar() {
    var campo = document.getElementById("novo");
    var partes = (campo ? campo.value : "").split(/[\n,;]+/).map(limparNome).filter(Boolean);
    var barrados = [], novos = 0;
    partes.forEach(function (p) {
      if (conflito(p)) barrados.push(p); else { S.names.push(p); novos++; }
    });
    // Quem foi barrado continua no campo para a pessoa completar o sobrenome.
    ui.draft = barrados.join("\n");
    salvar(); render();
    var c = document.getElementById("novo"); if (c) { c.focus(); c.style.height = "auto"; c.style.height = Math.min(c.scrollHeight, 160) + "px"; }
    if (barrados.length) {
      var ex = barrados[0], outro = conflito(ex), novoTemSobrenome = ex.indexOf(" ") > 0;
      toast(chave(outro) === chave(ex) && novoTemSobrenome ? outro + " já está na lista."
        : !novoTemSobrenome ? "Já tem " + outro + " na lista. Adicione com sobrenome."
        : "Já tem " + outro + " sem sobrenome na lista. Remova e adicione de novo com sobrenome.");
    }
    else if (S.names.length > MAX && novos) toast("Passou de " + MAX + ". Forme as duplas de revezamento.");
  }
  function primeiroNome(n) { return n.trim().split(" ")[0]; }
  // Bloqueia nome igual, e também mesmo primeiro nome quando um dos dois está sem sobrenome (João e João Silva).
  function conflito(novo) {
    var pn = chave(primeiroNome(novo)), so = novo.trim().indexOf(" ") < 0;
    for (var i = 0; i < S.names.length; i++) {
      var n = S.names[i];
      if (chave(n) === chave(novo)) return n;
      if (chave(primeiroNome(n)) === pn && (so || n.trim().indexOf(" ") < 0)) return n;
    }
    return null;
  }
  function removerNome(i) {
    var nm = S.names[i];
    S.names.splice(i, 1);
    S.pairs = S.pairs.filter(function (p) { return chave(p[0]) !== chave(nm) && chave(p[1]) !== chave(nm); });
    if (ui.sel === nm) ui.sel = null;
    salvar(); render();
  }

  app.addEventListener("input", function (e) {
    if (e.target.id === "novo") {
      ui.draft = e.target.value;
      e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px";
    }
  });
  app.addEventListener("keydown", function (e) {
    if (e.target.id === "novo" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); adicionar(); }
  });

  function onClick(e) {
    var b = e.target.closest("[data-a]");
    if (!b) return;
    var a = b.getAttribute("data-a");
    if (a === "close" && b.classList.contains("scrim") && e.target !== b) return;
    var r = ultima();
    switch (a) {
      case "view": ui.view = b.getAttribute("data-v"); window.scrollTo(0, 0); break;
      case "add": adicionar(); return;
      case "del": removerNome(+b.getAttribute("data-i")); return;
      case "exemplo": S.names = EXEMPLO.slice(); S.pairs = []; S.fromLast = false; salvar(); break;
      case "pick":
        var nm = b.getAttribute("data-n");
        if (!ui.sel) ui.sel = nm;
        else if (ui.sel === nm) ui.sel = null;
        else { S.pairs.push([ui.sel, nm]); ui.sel = null; salvar(); }
        break;
      case "undo": S.pairs.splice(+b.getAttribute("data-i"), 1); salvar(); break;
      case "mode": S.mode = b.getAttribute("data-v") === "random" ? "random" : "rank"; salvar(); break;
      case "ask": ui.sheet = b.getAttribute("data-s"); break;
      case "close": ui.sheet = null; break;
      case "draw": ui.sheet = null; if (prontoParaSortear() && !pendente()) sortear(); window.scrollTo(0, 0); break;
      case "cancel": ui.sheet = null; if (pendente()) { S.rounds.pop(); salvar(); } ui.view = "list"; ui.manual = null; break;
      case "clear": ui.sheet = null; S.names = []; S.pairs = []; ui.sel = null; S.fromLast = false; salvar(); break;
      case "reset": ui.sheet = null; S.rounds = S.rounds.filter(function (x) { return !x.closed; }); salvar(); toast("Histórico zerado"); break;
      case "zeropts": ui.sheet = null; S.scores = {}; salvar(); toast("Pontuação zerada"); break;
      case "win":
        if (!r || r.closed) return;
        r.winners[b.getAttribute("data-g")] = +b.getAttribute("data-t");
        limparInvalidos(r); salvar(); break;
      case "rankok":
        var auto = rankingAutomatico(r);
        if (auto && !r.closed) fecharComRanking(r, auto);
        break;
      case "fechar3": if (r && !r.closed && (r.teams.length !== 3 || r.winners.g1 !== undefined)) { r.closed = true; salvar(); } break;
      case "reabrir": if (r && r.closed) reabrir(r); break;
      case "manual": ui.manual = []; break;
      case "mpick": ui.manual.push(+b.getAttribute("data-t")); break;
      case "mreset": ui.manual = []; break;
      case "mcancel": ui.manual = null; break;
      case "mok":
        if (ui.manual && ui.manual.length === r.teams.length && !r.closed) { fecharComRanking(r, ui.manual.slice()); ui.manual = null; }
        break;
      case "nova": ui.view = "list"; window.scrollTo(0, 0); if (prontoParaSortear()) ui.sheet = "draw"; break;
      default: return;
    }
    render();
  }
  app.addEventListener("click", onClick);
  layer.addEventListener("click", onClick);

  render();

  if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)) {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  }
})();
</script>
<!--APP-END-->
